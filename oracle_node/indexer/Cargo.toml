[package]
name = "indexer"
categories.workspace = true
description.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
arboard = "3.4.1"
chrono = { features = ["serde"], version = "0.4" }
clap = { features = ["derive", "env", "std"], version = "4" }
futures = { default-features = false, version = "0.3" }
hex = "0.4"
lb-common-http-client = { workspace = true }
lb-core = { workspace = true }
logos-blockchain-zone-sdk = { path = "../logos-blockchain/zone-sdk" }
reqwest = { features = ["json", "rustls-tls"], workspace = true }
tokio = { default-features = false, features = [
    "io-std",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
], version = "1" }
tracing = { workspace = true }
tracing-subscriber = { features = ["env-filter"], version = "0.3" }
zeroize = { features = ["alloc"], workspace = true }
anyhow = "1.0.102"
serde.workspace = true
serde_json.workspace = true
# internal
common =  { path = "../common" }
prost = "0.14" # grpc
secp256k1 = { version = "0.29", features = ["rand", "hashes"] } # BIP-340 x-only
# contract
spel-framework = { git = "https://github.com/logos-co/spel.git", tag = "v0.6.0" }
spel-framework-core = { git = "https://github.com/logos-co/spel.git", tag = "v0.6.0", features = ["decode"] }
spel = { git = "https://github.com/logos-co/spel.git", tag = "v0.6.0" }
wallet = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0" }

[build-dependencies]
prost-build = "0.14"
